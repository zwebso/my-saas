name: Sleep Alarm Android build

on:
  push:
    paths:
      - "sleep-alarm-android/**"
      - ".github/workflows/sleep-alarm-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-alarm-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sleep-alarm-debug-apk
          path: sleep-alarm-android/app/build/outputs/apk/debug/app-debug.apk
